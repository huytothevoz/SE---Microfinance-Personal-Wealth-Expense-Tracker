<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <defs>
    <marker id="uml-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <polyline points="2 2, 10 6, 2 10" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="620" fill="#FFFFFF"/>

  <!-- System Boundary Box -->
  <rect x="20" y="20" width="1060" height="580" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="20" y="20" width="1060" height="46" fill="#F1F5F9" stroke="#000000" stroke-width="1.5"/>
  <text x="550" y="49" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">WealthFlow - Sơ đồ chi tiết UC02: Quản lý Ví tiền &amp; Nguồn vốn Mở sổ</text>

  <!-- Actor: Người dùng (End-User) -->
  <g id="actor-user">
    <circle cx="105" cy="260" r="17" fill="#BAE6FD" stroke="#0284C7" stroke-width="2"/>
    <line x1="105" y1="277" x2="105" y2="335" stroke="#0F172A" stroke-width="2"/>
    <line x1="75" y1="298" x2="135" y2="298" stroke="#0F172A" stroke-width="2"/>
    <line x1="105" y1="335" x2="80" y2="390" stroke="#0F172A" stroke-width="2"/>
    <line x1="105" y1="335" x2="130" y2="390" stroke="#0F172A" stroke-width="2"/>
    <text x="105" y="415" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Người dùng</text>
    <text x="105" y="435" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">(End-User)</text>
  </g>

  <!-- ==================== PRIMARY USE CASES ==================== -->
  <!-- UC1: Tạo ví thanh toán mới -->
  <ellipse cx="370" cy="130" rx="115" ry="32" fill="#7DD3FC" stroke="#0284C7" stroke-width="2"/>
  <text x="370" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Tạo ví thanh toán mới</text>

  <!-- UC2: Xem chi tiết & Theo dõi số dư ví -->
  <ellipse cx="370" cy="260" rx="120" ry="32" fill="#7DD3FC" stroke="#0284C7" stroke-width="2"/>
  <text x="370" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Xem chi tiết &amp; Số dư ví</text>

  <!-- UC3: Điều chỉnh số dư thực tế -->
  <ellipse cx="370" cy="390" rx="120" ry="32" fill="#7DD3FC" stroke="#0284C7" stroke-width="2"/>
  <text x="370" y="395" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Điều chỉnh số dư thực tế</text>

  <!-- UC4: Lưu trữ / Đóng ví (Archive) -->
  <ellipse cx="370" cy="515" rx="115" ry="30" fill="#7DD3FC" stroke="#0284C7" stroke-width="2"/>
  <text x="370" y="520" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Lưu trữ / Đóng ví (Archive)</text>

  <!-- ==================== SECONDARY / INCLUDED / EXTENDED USE CASES ==================== -->
  <!-- UC Ext 1: Hạch toán Vốn mở sổ -->
  <ellipse cx="780" cy="130" rx="140" ry="34" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="780" y="127" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#0369A1" text-anchor="middle">Hạch toán Vốn mở sổ (Equity BR02)</text>
  <text x="780" y="143" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">[Kích hoạt khi Số dư ban đầu &gt; 0]</text>

  <!-- UC Inc 2: Tính toán Số dư khả dụng -->
  <ellipse cx="780" cy="260" rx="140" ry="34" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="780" y="257" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#0369A1" text-anchor="middle">Tính toán Số dư khả dụng (BR04)</text>
  <text x="780" y="273" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">(Cached Balance - Earmarked)</text>

  <!-- UC Inc 3: Sinh bút toán chênh lệch kiểm kê -->
  <ellipse cx="780" cy="390" rx="140" ry="34" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="780" y="387" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#0369A1" text-anchor="middle">Sinh bút toán chênh lệch kiểm kê</text>
  <text x="780" y="403" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">(Tự động cân bằng Nợ/Có BR01)</text>

  <!-- UC Inc 4: Ràng buộc lịch sử giao dịch -->
  <ellipse cx="780" cy="515" rx="140" ry="30" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="780" y="520" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#0369A1" text-anchor="middle">Kiểm tra lịch sử giao dịch (Cấm xóa cứng)</text>

  <!-- ==================== CONNECTIONS ==================== -->
  <!-- User to Primary UCs -->
  <line x1="135" y1="310" x2="260" y2="145" stroke="#000000" stroke-width="1.5"/>
  <line x1="135" y1="310" x2="252" y2="260" stroke="#000000" stroke-width="1.5"/>
  <line x1="135" y1="310" x2="252" y2="390" stroke="#000000" stroke-width="1.5"/>
  <line x1="135" y1="310" x2="260" y2="505" stroke="#000000" stroke-width="1.5"/>

  <!-- Relationships -->
  <!-- Equity extends CreateWallet (arrow points from extended to base) -->
  <line x1="640" y1="130" x2="495" y2="130" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#uml-arrow)"/>
  <text x="565" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

  <!-- View includes Calc Available (arrow points from base to included) -->
  <line x1="490" y1="260" x2="630" y2="260" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#uml-arrow)"/>
  <text x="565" y="250" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Adjust includes Diff Entry -->
  <line x1="490" y1="390" x2="630" y2="390" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#uml-arrow)"/>
  <text x="565" y="380" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Archive includes History Check -->
  <line x1="485" y1="515" x2="630" y2="515" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#uml-arrow)"/>
  <text x="560" y="505" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>
</svg>
