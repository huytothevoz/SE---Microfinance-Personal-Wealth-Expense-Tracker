<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" width="980" height="650" font-family="Segoe UI, Arial, sans-serif">
  
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e3a8a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#be123c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#047857"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="980" height="650" fill="#ffffff"/>

  <!-- Outer Frame & Title Bar -->
  <rect x="12" y="10" width="956" height="630" rx="8" fill="#fcfdff" stroke="#1e293b" stroke-width="2.4"/>
  <rect x="12" y="10" width="956" height="40" rx="8" fill="#1e293b"/>
  <text x="490" y="36" text-anchor="middle" fill="#ffffff" font-size="16.5" font-weight="700">Sơ đồ Hoạt động Phân làn AD05 — Giao dịch Định kỳ Tự động &amp; Kẹp Ngày Cuối tháng (UC06 / SYS01)</text>

  <!-- 3 Parallel Vertical Swimlanes (y=56..592) -->
  <!-- Lane 1: x=20..312 (w=292) -->
  <rect x="20" y="56" width="292" height="536" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <rect x="20" y="56" width="292" height="36" rx="6" fill="#0284c7"/>
  <text x="166" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 1: NGƯỜI DÙNG / CRON SYS01</text>

  <!-- Lane 2: x=320..660 (w=340) -->
  <rect x="320" y="56" width="340" height="536" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
  <rect x="320" y="56" width="340" height="36" rx="6" fill="#d97706"/>
  <text x="490" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 2: TẦNG ĐIỀU KHIỂN (RecurringService)</text>

  <!-- Lane 3: x=668..960 (w=292) -->
  <rect x="668" y="56" width="292" height="536" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="668" y="56" width="292" height="36" rx="6" fill="#059669"/>
  <text x="814" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 3: TẦNG CSDL (RecurringDAO)</text>

  
  
    <circle cx="166" cy="112" r="11" fill="#0f172a"/>
    <circle cx="166" cy="568" r="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.8"/>
    <circle cx="166" cy="568" r="6.5" fill="#0f172a"/>
    
  <line x1="166" y1="123" x2="166" y2="146" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arr-navy)"/>

  <!-- Row 1 (y=180) -->
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="148.0" width="264" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="166" y="174" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">1. Cài đặt Lịch hoặc Cron Quét</text>
        <text x="166" y="195" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">Chọn Ngày neo (1..31) &amp; Chế độ chạy</text>
        
    </g>
    
  <line x1="298" y1="180" x2="338" y2="180" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arr-navy)"/>

  
    <g filter="url(#shadow)">
      <rect x="338.0" y="148.0" width="304" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="490" y="174" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">2. Quét Lịch Đến hạn Hàng ngày</text>
        <text x="490" y="195" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">RecurringService::processDueSchedules()</text>
        
    </g>
    
  <line x1="642" y1="180" x2="678" y2="180" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>

  
    <g filter="url(#shadow)">
      <rect x="681.0" y="148.0" width="266" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="174" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">3. Truy vấn Lịch ACTIVE Đến hạn</text>
        <text x="814" y="195" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">WHERE next_due_date &lt;= CURDATE()</text>
        
    </g>
    

  <!-- Row 2 (y=295) -->
  <path d="M 814 212 L 814 238 L 490 238 L 490 253" fill="none" stroke="#be123c" stroke-width="2.4" marker-end="url(#arr-red)"/>
  
    <g filter="url(#shadow)">
      <polygon points="490,255 642,295 490,335 338,295" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/>
      
        <text x="490" y="291" text-anchor="middle" fill="#78350f" font-size="13.5" font-weight="700">Chốt 1: Kiểm tra Chế độ Lịch</text>
        <text x="490" y="308" text-anchor="middle" fill="#92400e" font-size="13" font-weight="700">AUTO_POST hay DRAFT_REMINDER?</text>
        
    </g>
    

  <line x1="642" y1="295" x2="678" y2="295" stroke="#be123c" stroke-width="2.6" marker-end="url(#arr-red)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="261.0" width="266" height="68" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.6"/>
      
        <rect x="671.0" y="249.0" width="286.0" height="21" rx="10" fill="#be123c"/>
        <text x="814" y="264.0" text-anchor="middle" fill="#ffffff" font-size="11.8" font-weight="700">[*] TRỌNG TÂM 1: AUTO-POST NGUYÊN TỬ</text>
        
      
        <text x="814" y="292" text-anchor="middle" fill="#881337" font-size="14.5" font-weight="700">4A. Tự động Ghi Sổ cái Kép</text>
        <text x="814" y="312" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Khóa Ví FOR UPDATE &amp; Ghi POSTED</text>
        
    </g>
    

  <!-- Row 3 (y=408) -->
  <line x1="338" y1="295" x2="298" y2="295" stroke="#b45309" stroke-width="2.4" marker-end="url(#arr-amber)"/>
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="263.0" width="264" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="166" y="289" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">4B. Tạo Bản nháp &amp; Gửi Nhắc nhở</text>
        <text x="166" y="310" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">Chờ người dùng duyệt (DRAFT)</text>
        
    </g>
    

  <path d="M 814 329 L 814 356 L 490 356 L 490 370" fill="none" stroke="#be123c" stroke-width="2.4" marker-end="url(#arr-red)"/>
  <path d="M 166 327 L 166 408 L 334 408" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#arr-amber)"/>

  
    <g filter="url(#shadow)">
      <rect x="334.0" y="375.0" width="312" height="70" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.6"/>
      
        <rect x="343.25" y="363.0" width="293.5" height="21" rx="10" fill="#be123c"/>
        <text x="490" y="378.0" text-anchor="middle" fill="#ffffff" font-size="11.8" font-weight="700">[*] TRỌNG TÂM 2: DATE CLAMPING (BR09)</text>
        
      
        <text x="490" y="407" text-anchor="middle" fill="#881337" font-size="14.5" font-weight="700">5. Thuật toán Kẹp Ngày Cuối tháng</text>
        <text x="490" y="427" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">nextDay = min(anchor_day, lastDayOfMonth)</text>
        
    </g>
    

  <line x1="646" y1="410" x2="678" y2="410" stroke="#047857" stroke-width="2.5" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="376.0" width="266" height="68" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="404" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">6. Cập nhật Kỳ hạn Tiếp theo</text>
        <text x="814" y="425" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Ví dụ: Neo 31 -&gt; 28/02 hoặc 29/02</text>
        
    </g>
    

  <!-- Row 4 (y=512) -->
  <line x1="814" y1="444" x2="814" y2="478" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="480.0" width="266" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="506" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">7. Lưu Lịch &amp; Thông báo Hệ thống</text>
        <text x="814" y="527" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">UPDATE recurring + INSERT notification</text>
        
    </g>
    

  <line x1="681" y1="512" x2="642" y2="512" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="338.0" y="480.0" width="304" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="490" y="506" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">8. Hoàn tất Chu kỳ Quét Cron</text>
        <text x="490" y="527" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">Ghi log thực thi SYS01 thành công</text>
        
    </g>
    

  <line x1="338" y1="512" x2="298" y2="512" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="480.0" width="264" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="166" y="506" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">9. Hiển thị Giao dịch &amp; Lịch Mới</text>
        <text x="166" y="527" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Cập nhật Danh sách Định kỳ SPA</text>
        
    </g>
    
  <line x1="166" y1="544" x2="166" y2="556" stroke="#0f172a" stroke-width="2.4"/>


  <!-- Bottom Focal Bar -->
  <rect x="20" y="598" width="940" height="34" rx="6" fill="#0f172a"/>
  <text x="36" y="620" fill="#fbbf24" font-size="13.5" font-weight="700">[*] TRỌNG TÂM: Công thức min(day_of_month, lastDayOfTargetMonth) ngăn chặn hoàn toàn lỗi tràn ngày dương lịch (31/01 -&gt; 28/02).</text>
</svg>
