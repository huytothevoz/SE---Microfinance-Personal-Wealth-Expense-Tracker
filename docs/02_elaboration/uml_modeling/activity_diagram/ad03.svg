<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" width="980" height="650" font-family="Segoe UI, Arial, sans-serif">
  
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e3a8a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#be123c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#047857"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="980" height="650" fill="#ffffff"/>

  <!-- Outer Frame & Title Bar -->
  <rect x="12" y="10" width="956" height="630" rx="8" fill="#fcfdff" stroke="#1e293b" stroke-width="2.4"/>
  <rect x="12" y="10" width="956" height="40" rx="8" fill="#1e293b"/>
  <text x="490" y="36" text-anchor="middle" fill="#ffffff" font-size="16.5" font-weight="700">Sơ đồ Hoạt động Phân làn Trọng tâm 2 — Cảnh báo Ngân sách Jump-Over-Yellow (AD03 / SYS02)</text>

  <!-- 3 Parallel Vertical Swimlanes (y=56..592) -->
  <!-- Lane 1: x=20..312 (w=292) -->
  <rect x="20" y="56" width="292" height="536" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <rect x="20" y="56" width="292" height="36" rx="6" fill="#0284c7"/>
  <text x="166" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 1: SỔ CÁI &amp; GIAO DIỆN SPA</text>

  <!-- Lane 2: x=320..660 (w=340) -->
  <rect x="320" y="56" width="340" height="536" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
  <rect x="320" y="56" width="340" height="36" rx="6" fill="#d97706"/>
  <text x="490" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 2: ĐỘNG CƠ NGÂN SÁCH (BudgetService)</text>

  <!-- Lane 3: x=668..960 (w=292) -->
  <rect x="668" y="56" width="292" height="536" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="668" y="56" width="292" height="36" rx="6" fill="#059669"/>
  <text x="814" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 3: TẦNG CSDL (BudgetDAO &amp; InnoDB)</text>

  
  
    <circle cx="166" cy="112" r="11" fill="#0f172a"/>
    <circle cx="166" cy="568" r="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.8"/>
    <circle cx="166" cy="568" r="6.5" fill="#0f172a"/>
    
  <line x1="166" y1="123" x2="166" y2="146" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arr-navy)"/>

  <!-- Row 1 (y=180) -->
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="148.0" width="264" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="166" y="174" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">1. Giao dịch Chi tiêu Hoàn tất</text>
        <text x="166" y="195" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">LedgerService Commit EXPENSE</text>
        
    </g>
    
  <line x1="298" y1="180" x2="336" y2="180" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arr-navy)"/>

  
    <g filter="url(#shadow)">
      <rect x="338.0" y="148.0" width="304" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="490" y="174" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">2. Tính Tổng Chi tiêu Ròng Tháng</text>
        <text x="490" y="195" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">NetSpend = ΣExpense - ΣReversal</text>
        
    </g>
    
  <line x1="642" y1="180" x2="678" y2="180" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>

  
    <g filter="url(#shadow)">
      <rect x="681.0" y="148.0" width="266" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="174" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">3. Truy vấn Hạn mức &amp; 2 Cờ</text>
        <text x="814" y="195" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Đọc limit, notified_80, notified_100</text>
        
    </g>
    

  <!-- Row 2 (y=295): Chốt 1 (>= 100%) -->
  <path d="M 814 212 L 814 238 L 490 238 L 490 253" fill="none" stroke="#be123c" stroke-width="2.4" marker-end="url(#arr-red)"/>
  
    <g filter="url(#shadow)">
      <polygon points="490,253 646,295 490,337 334,295" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/>
      
        <text x="490" y="291" text-anchor="middle" fill="#78350f" font-size="13.5" font-weight="700">Chốt 1 (Ưu tiên cao nhất):</text>
        <text x="490" y="308" text-anchor="middle" fill="#92400e" font-size="13" font-weight="700">Ratio &gt;= 100% (notified_100=0)?</text>
        
    </g>
    

  <line x1="646" y1="295" x2="678" y2="295" stroke="#be123c" stroke-width="2.8" marker-end="url(#arr-red)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="260.0" width="266" height="70" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.6"/>
      
        <rect x="689.75" y="248.0" width="248.5" height="21" rx="10" fill="#be123c"/>
        <text x="814" y="263.0" text-anchor="middle" fill="#ffffff" font-size="11.8" font-weight="700">[*] TRỌNG TÂM: JUMP-OVER-YELLOW</text>
        
      
        <text x="814" y="292" text-anchor="middle" fill="#881337" font-size="14.5" font-weight="700">4A. Bật CẢ 2 CỜ &amp; Ghi CRITICAL</text>
        <text x="814" y="312" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">SET notified_80=1, notified_100=1</text>
        
    </g>
    

  <!-- Row 3 (y=408): Chốt 2 (80%..100%) -->
  <line x1="490" y1="337" x2="490" y2="366" stroke="#b45309" stroke-width="2.4" marker-end="url(#arr-amber)"/>
  
    <rect x="425.4" y="341" width="129.2" height="19" rx="5" fill="#ffffff" fill-opacity="0.96" stroke="#b45309" stroke-width="1.0"/>
    <text x="490" y="354.5" text-anchor="middle" fill="#b45309" font-size="12.2" font-weight="700">[Chưa vượt 100%]</text>
    
  
    <g filter="url(#shadow)">
      <polygon points="490,366 646,408 490,450 334,408" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/>
      
        <text x="490" y="404" text-anchor="middle" fill="#78350f" font-size="13.5" font-weight="700">Chốt 2 (Ngưỡng Vàng 80%):</text>
        <text x="490" y="421" text-anchor="middle" fill="#92400e" font-size="13" font-weight="700">Ratio &gt;= 80% (notified_80=0)?</text>
        
    </g>
    

  <line x1="334" y1="408" x2="298" y2="408" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="377.0" width="264" height="62" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="166" y="402" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">Giữ trạng thái GREEN (&lt; 80%)</text>
        <text x="166" y="423" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Không sinh thông báo trùng lặp</text>
        
    </g>
    

  <line x1="646" y1="408" x2="678" y2="408" stroke="#b45309" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="376.0" width="266" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="814" y="402" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">4B. Bật Cờ 80% &amp; Ghi WARNING</text>
        <text x="814" y="423" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">SET notified_80=1 (dedup_key)</text>
        
    </g>
    

  <!-- Row 4 (y=512): Merge & UI Alert -->
  <line x1="814" y1="330" x2="952" y2="330" stroke="#be123c" stroke-width="2.4"/>
  <line x1="952" y1="330" x2="952" y2="512" stroke="#be123c" stroke-width="2.4"/>
  <line x1="952" y1="512" x2="947" y2="512" stroke="#be123c" stroke-width="2.4" marker-end="url(#arr-red)"/>
  <line x1="814" y1="440" x2="814" y2="478" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>

  
    <g filter="url(#shadow)">
      <rect x="681.0" y="480.0" width="266" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="506" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">5. Lưu Thông báo Chống trùng</text>
        <text x="814" y="527" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">INSERT notifications (UNIQUE key)</text>
        
    </g>
    
  <line x1="681" y1="512" x2="642" y2="512" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>

  
    <g filter="url(#shadow)">
      <rect x="338.0" y="480.0" width="304" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="490" y="506" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">6. Đóng gói Trạng thái Cảnh báo</text>
        <text x="490" y="527" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">Đính kèm Alert Level vào JSON</text>
        
    </g>
    
  <line x1="338" y1="512" x2="298" y2="512" stroke="#be123c" stroke-width="2.5" marker-end="url(#arr-red)"/>

  
    <g filter="url(#shadow)">
      <rect x="34.0" y="480.0" width="264" height="64" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.6"/>
      
      
        <text x="166" y="506" text-anchor="middle" fill="#881337" font-size="14.5" font-weight="700">7. Hiển thị Toast / Urgent Modal</text>
        <text x="166" y="527" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Cập nhật Thanh tiến độ Ngân sách</text>
        
    </g>
    
  <line x1="166" y1="544" x2="166" y2="556" stroke="#0f172a" stroke-width="2.4"/>


  <!-- Bottom Focal Bar -->
  <rect x="20" y="598" width="940" height="34" rx="6" fill="#0f172a"/>
  <text x="36" y="620" fill="#fbbf24" font-size="13.5" font-weight="700">[*] TRỌNG TÂM: Kiểm tra ngưỡng 100% trước 80%; nếu nhảy cóc từ &lt;80% lên &gt;100% sẽ bật cả 2 cờ để chỉ phát 1 cảnh báo CRITICAL duy nhất.</text>
</svg>
