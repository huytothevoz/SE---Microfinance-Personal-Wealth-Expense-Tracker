, Arial, sans-serif">3. Bấm "Lưu ví"</text><rect x="26" y="387.839" width="280.906" height="33.969" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="36" y="408.978" fill="#0F172A" font-size="12" textLength="260.906" font-family="'Segoe UI', Arial, sans-serif">5. Hiển thị thông báo lỗi (400 Bad Request)</text><ellipse cx="166.453" cy="466.777" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="166.453" cy="466.777" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="384.247" y="698.023" width="295.859" height="47.938" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="394.247" y="719.162" fill="#0F172A" font-size="12" textLength="275.859" font-family="'Segoe UI', Arial, sans-serif">9. Hiển thị thông báo "Tạo ví mới thành công"</text><text x="394.247" y="733.13" fill="#0F172A" font-size="12" textLength="266.889" font-family="'Segoe UI', Arial, sans-serif">và cập nhật danh sách ví sẵn sàng giao dịch</text><ellipse cx="532.177" cy="776.96" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="532.177" cy="776.96" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="53.863" x2="20" y2="799.96" style="stroke:#334155;stroke-width:1.5;"/><rect x="690.778" y="53.863" width="647.763" height="746.098" fill="#F1F5F9" style="stroke:#F1F5F9;stroke-width:1;"/><rect x="696.778" y="289.871" width="475.262" height="33.969" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="706.778" y="311.009" fill="#0F172A" font-size="12" textLength="455.262" font-family="'Segoe UI', Arial, sans-serif">4. Kiểm tra tính hợp lệ dữ liệu (Tên ví không rỗng/không trùng, Số dư >= 0)</text><polygon points="866.431,343.839,1002.386,343.839,1014.386,355.839,1002.386,367.839,866.431,367.839,854.431,355.839,866.431,343.839" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="866.43