<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" width="980" height="650" font-family="Segoe UI, Arial, sans-serif">
  
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e3a8a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#be123c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#047857"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="980" height="650" fill="#ffffff"/>

  <!-- Outer Frame & Title Bar -->
  <rect x="12" y="10" width="956" height="630" rx="8" fill="#fcfdff" stroke="#1e293b" stroke-width="2.4"/>
  <rect x="12" y="10" width="956" height="40" rx="8" fill="#1e293b"/>
  <text x="490" y="36" text-anchor="middle" fill="#ffffff" font-size="16.5" font-weight="700">Sơ đồ Hoạt động Phân làn — Đối soát Sổ cái Kép &amp; Làm sạch Tệp CSV chuẩn OWASP (AD10)</text>

  <!-- 3 Parallel Vertical Swimlanes (y=56..592) -->
  <!-- Lane 1: x=20..312 (w=292) -->
  <rect x="20" y="56" width="292" height="536" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <rect x="20" y="56" width="292" height="36" rx="6" fill="#0284c7"/>
  <text x="166" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 1: NGƯỜI DÙNG / SPA</text>

  <!-- Lane 2: x=320..660 (w=340) -->
  <rect x="320" y="56" width="340" height="536" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
  <rect x="320" y="56" width="340" height="36" rx="6" fill="#d97706"/>
  <text x="490" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 2: ĐỐI SOÁT &amp; XUẤT CSV (ExportService)</text>

  <!-- Lane 3: x=668..960 (w=292) -->
  <rect x="668" y="56" width="292" height="536" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="668" y="56" width="292" height="36" rx="6" fill="#059669"/>
  <text x="814" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 3: TẦNG CSDL (LedgerDAO &amp; InnoDB)</text>

  
  
    <circle cx="166" cy="112" r="11" fill="#0f172a"/>
    <circle cx="166" cy="568" r="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.8"/>
    <circle cx="166" cy="568" r="6.5" fill="#0f172a"/>
    
  <line x1="166" y1="123" x2="166" y2="146" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arr-navy)"/>

  
    <g filter="url(#shadow)">
      <rect x="34.0" y="148.0" width="264" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="166" y="174" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">1. Yêu cầu Đối soát / Xuất CSV</text>
        <text x="166" y="195" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">Chọn Ví &amp; Kỳ sao kê (Từ ngày - Đến ngày)</text>
        
    </g>
    
  <line x1="298" y1="180" x2="338" y2="180" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arr-navy)"/>

  
    <g filter="url(#shadow)">
      <rect x="338.0" y="148.0" width="304" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="490" y="174" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">2. Khởi chạy Kiểm toán Đối soát</text>
        <text x="490" y="195" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">ReconciliationService::auditWallets()</text>
        
    </g>
    
  <line x1="642" y1="180" x2="678" y2="180" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>

  
    <g filter="url(#shadow)">
      <rect x="681.0" y="148.0" width="266" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="174" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">3. Tổng hợp Dòng Bút toán Kép</text>
        <text x="814" y="195" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Tính Σ(Debit_Base) - Σ(Credit_Base)</text>
        
    </g>
    

  <path d="M 814 212 L 814 242 L 490 242 L 490 256" fill="none" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arr-navy)"/>
  
    <g filter="url(#shadow)">
      <polygon points="490,256 646,298 490,340 334,298" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/>
      
        <text x="490" y="294" text-anchor="middle" fill="#78350f" font-size="13.5" font-weight="700">Chốt 1: Khớp Số dư Sổ cái?</text>
        <text x="490" y="311" text-anchor="middle" fill="#92400e" font-size="13" font-weight="700">cached == Σ(Debit - Credit)?</text>
        
    </g>
    

  <line x1="334" y1="298" x2="298" y2="298" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-red)"/>
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="266.0" width="264" height="64" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
      
      
        <text x="166" y="292" text-anchor="middle" fill="#991b1b" font-size="14.5" font-weight="700">Cảnh báo Lệch Sổ (MISMATCH)</text>
        <text x="166" y="313" text-anchor="middle" fill="#475569" font-size="13.2" font-weight="600">Ghi log kiểm toán &amp; Khoanh vùng ví</text>
        
    </g>
    

  <line x1="490" y1="338" x2="490" y2="376" stroke="#047857" stroke-width="2.5" marker-end="url(#arr-green)"/>
  
    <rect x="407.4" y="346" width="165.20000000000002" height="19" rx="5" fill="#ffffff" fill-opacity="0.96" stroke="#047857" stroke-width="1.0"/>
    <text x="490" y="359.5" text-anchor="middle" fill="#047857" font-size="12.2" font-weight="700">[Khớp 100% (MATCHED)]</text>
    
  
    <g filter="url(#shadow)">
      <rect x="336.0" y="378.0" width="308" height="68" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.6"/>
      
        <rect x="354.5" y="366.0" width="271.0" height="21" rx="10" fill="#be123c"/>
        <text x="490" y="381.0" text-anchor="middle" fill="#ffffff" font-size="11.8" font-weight="700">[*] TRỌNG TÂM: CHỐNG CSV INJECTION</text>
        
      
        <text x="490" y="409" text-anchor="middle" fill="#881337" font-size="14.5" font-weight="700">4. Quét &amp; Khử Độc Công thức CSV</text>
        <text x="490" y="429" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Thêm dấu nháy đơn (') trước =, +, -, @</text>
        
    </g>
    

  <line x1="644" y1="412" x2="678" y2="412" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="378.0" width="266" height="68" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="406" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">5. Đóng gói Tệp UTF-8 BOM</text>
        <text x="814" y="427" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Chèn Byte Order Mark (EF BB BF)</text>
        
    </g>
    

  <line x1="814" y1="446" x2="814" y2="478" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="480.0" width="266" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="506" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">6. Ghi Nhật ký Xuất Dữ liệu</text>
        <text x="814" y="527" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">INSERT audit_logs (EXPORT_CSV)</text>
        
    </g>
    

  <line x1="681" y1="512" x2="298" y2="512" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="480.0" width="264" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="166" y="506" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">7. Tải Tệp CSV An toàn về Máy</text>
        <text x="166" y="527" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Hiển thị chuẩn tiếng Việt trên Excel</text>
        
    </g>
    
  <line x1="166" y1="544" x2="166" y2="556" stroke="#0f172a" stroke-width="2.4"/>


  <!-- Bottom Focal Bar -->
  <rect x="20" y="598" width="940" height="34" rx="6" fill="#0f172a"/>
  <text x="36" y="620" fill="#fbbf24" font-size="13.5" font-weight="700">[*] ĐIỂM NHẤN: So khớp độc lập cached_balance với tổng bút toán sổ cái kép; vô hiệu hóa tiền tố công thức độc hại (=, +, -, @).</text>
</svg>
