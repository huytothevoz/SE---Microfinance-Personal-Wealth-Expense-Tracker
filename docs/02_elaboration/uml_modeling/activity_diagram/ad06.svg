<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" width="980" height="650" font-family="Segoe UI, Arial, sans-serif">
  
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e3a8a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#be123c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#047857"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="980" height="650" fill="#ffffff"/>

  <!-- Outer Frame & Title Bar -->
  <rect x="12" y="10" width="956" height="630" rx="8" fill="#fcfdff" stroke="#1e293b" stroke-width="2.4"/>
  <rect x="12" y="10" width="956" height="40" rx="8" fill="#1e293b"/>
  <text x="490" y="36" text-anchor="middle" fill="#ffffff" font-size="16.5" font-weight="700">Sơ đồ Hoạt động Phân làn Trọng tâm 3 — Tín dụng Vi mô &amp; Thanh toán Tách Gốc – Lãi (AD06 / BR17)</text>

  <!-- 3 Parallel Vertical Swimlanes (y=56..592) -->
  <!-- Lane 1: x=20..312 (w=292) -->
  <rect x="20" y="56" width="292" height="536" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <rect x="20" y="56" width="292" height="36" rx="6" fill="#0284c7"/>
  <text x="166" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 1: NGƯỜI DÙNG (Borrower / Lender)</text>

  <!-- Lane 2: x=320..660 (w=340) -->
  <rect x="320" y="56" width="340" height="536" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
  <rect x="320" y="56" width="340" height="36" rx="6" fill="#d97706"/>
  <text x="490" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 2: TẦNG ĐIỀU KHIỂN (LoanService)</text>

  <!-- Lane 3: x=668..960 (w=292) -->
  <rect x="668" y="56" width="292" height="536" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="668" y="56" width="292" height="36" rx="6" fill="#059669"/>
  <text x="814" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 3: TẦNG CSDL (Loan &amp; LedgerDAO)</text>

  
  
    <circle cx="166" cy="112" r="11" fill="#0f172a"/>
    <circle cx="166" cy="568" r="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.8"/>
    <circle cx="166" cy="568" r="6.5" fill="#0f172a"/>
    
  <line x1="166" y1="123" x2="166" y2="146" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arr-navy)"/>

  <!-- Row 1 (y=180) -->
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="148.0" width="264" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="166" y="174" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">1. Yêu cầu Giải ngân / Trả nợ</text>
        <text x="166" y="195" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">Nhập Tiền gốc &amp; Tiền lãi/phí</text>
        
    </g>
    
  <line x1="298" y1="180" x2="342" y2="180" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arr-navy)"/>

  
    <g filter="url(#shadow)">
      <polygon points="490,142 636,180 490,218 344,180" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/>
      
        <text x="490" y="176" text-anchor="middle" fill="#78350f" font-size="13.5" font-weight="700">Phân nhánh Nghiệp vụ Vay:</text>
        <text x="490" y="193" text-anchor="middle" fill="#92400e" font-size="13" font-weight="700">Giải ngân mới hay Trả nợ kỳ?</text>
        
    </g>
    
  <line x1="636" y1="180" x2="678" y2="180" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arr-navy)"/>

  
    <g filter="url(#shadow)">
      <rect x="681.0" y="146.0" width="266" height="68" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.6"/>
      
        <rect x="671.0" y="134.0" width="286.0" height="21" rx="10" fill="#be123c"/>
        <text x="814" y="149.0" text-anchor="middle" fill="#ffffff" font-size="11.8" font-weight="700">[*] TRỌNG TÂM 1: KHÔNG LỆCH THU NHẬP</text>
        
      
        <text x="814" y="177" text-anchor="middle" fill="#881337" font-size="14.5" font-weight="700">2A. Ghi Sổ Giải ngân (BR17)</text>
        <text x="814" y="197" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Tài sản &lt;-&gt; Nợ (Cấm vào INCOME)</text>
        
    </g>
    

  <!-- Row 2 (y=295) -->
  <line x1="490" y1="218" x2="490" y2="255" stroke="#be123c" stroke-width="2.6" marker-end="url(#arr-red)"/>
  
    <rect x="403.8" y="226" width="172.4" height="19" rx="5" fill="#ffffff" fill-opacity="0.96" stroke="#be123c" stroke-width="1.0"/>
    <text x="490" y="239.5" text-anchor="middle" fill="#be123c" font-size="12.2" font-weight="700">[Thanh toán Kỳ Trả nợ]</text>
    
  
    <g filter="url(#shadow)">
      <rect x="337.0" y="262.0" width="306" height="66" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="490" y="289" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">2B. Kiểm tra Dư nợ Gốc &amp; Số dư Ví</text>
        <text x="490" y="310" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">principalPaid &lt;= principal_remaining</text>
        
    </g>
    

  <line x1="643" y1="295" x2="678" y2="295" stroke="#be123c" stroke-width="2.6" marker-end="url(#arr-red)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="262.0" width="266" height="66" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="289" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">3. Khóa Dòng Ví &amp; Hợp đồng Vay</text>
        <text x="814" y="310" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">SELECT ... FOR UPDATE (2 bảng)</text>
        
    </g>
    

  <!-- Row 3 (y=408) -->
  <path d="M 814 328 L 814 354 L 490 354 L 490 370" fill="none" stroke="#be123c" stroke-width="2.5" marker-end="url(#arr-red)"/>
  
    <g filter="url(#shadow)">
      <rect x="334.0" y="376.0" width="312" height="72" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.6"/>
      
        <rect x="332.0" y="364.0" width="316.0" height="21" rx="10" fill="#be123c"/>
        <text x="490" y="379.0" text-anchor="middle" fill="#ffffff" font-size="11.8" font-weight="700">[*] TRỌNG TÂM 2: TÁCH BẠCH GỐC &amp; LÃI</text>
        
      
        <text x="490" y="409" text-anchor="middle" fill="#881337" font-size="14.5" font-weight="700">4. Tách 2 Bút toán Kép Nguyên tử</text>
        <text x="490" y="429" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Gốc: LOAN_PAYMENT | Lãi: EXPENSE/INCOME</text>
        
    </g>
    

  <line x1="646" y1="412" x2="678" y2="412" stroke="#047857" stroke-width="2.6" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="378.0" width="266" height="68" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="406" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">5. Trừ Dư gốc &amp; Lưu 2 Khóa FK</text>
        <text x="814" y="427" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">principal_tx_id &amp; interest_tx_id</text>
        
    </g>
    

  <!-- Row 4 (y=512) -->
  <line x1="814" y1="446" x2="814" y2="478" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="480.0" width="266" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="506" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">6. Kiểm tra Tất toán &amp; Commit</text>
        <text x="814" y="527" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Nếu dư gốc == 0 -&gt; status='CLOSED'</text>
        
    </g>
    

  <line x1="681" y1="512" x2="643" y2="512" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="337.0" y="480.0" width="306" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="490" y="506" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">7. Kích hoạt Ngân sách (Phần Lãi)</text>
        <text x="490" y="527" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">Chỉ tính Lãi đi vay vào Chi tiêu</text>
        
    </g>
    

  <line x1="337" y1="512" x2="298" y2="512" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="480.0" width="264" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="166" y="506" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">8. Cập nhật Dư nợ &amp; Net Worth</text>
        <text x="166" y="527" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Hiển thị Biên lai Tách Gốc / Lãi</text>
        
    </g>
    
  <line x1="166" y1="544" x2="166" y2="556" stroke="#0f172a" stroke-width="2.4"/>


  <!-- Bottom Focal Bar -->
  <rect x="20" y="598" width="940" height="34" rx="6" fill="#0f172a"/>
  <text x="36" y="620" fill="#fbbf24" font-size="13.5" font-weight="700">[*] TRỌNG TÂM: Giải ngân không ghi vào Thu nhập; Trả nợ tách nguyên tử Tiền gốc (LOAN_PAYMENT) và Tiền lãi (EXPENSE/INCOME).</text>
</svg>
