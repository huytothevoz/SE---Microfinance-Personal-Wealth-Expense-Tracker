<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" width="980" height="650" font-family="Segoe UI, Arial, sans-serif">
  
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e3a8a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#be123c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#047857"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="980" height="650" fill="#ffffff"/>

  <!-- Outer Frame & Title Bar -->
  <rect x="12" y="10" width="956" height="630" rx="8" fill="#fcfdff" stroke="#1e293b" stroke-width="2.4"/>
  <rect x="12" y="10" width="956" height="40" rx="8" fill="#1e293b"/>
  <text x="490" y="36" text-anchor="middle" fill="#ffffff" font-size="16.5" font-weight="700">Sơ đồ Hoạt động Phân làn AD01 — Đăng ký, Xác thực Bcrypt (cost=12) &amp; Hybrid JWT (UC01)</text>

  <!-- 3 Parallel Vertical Swimlanes (y=56..592) -->
  <!-- Lane 1: x=20..312 (w=292) -->
  <rect x="20" y="56" width="292" height="536" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <rect x="20" y="56" width="292" height="36" rx="6" fill="#0284c7"/>
  <text x="166" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 1: KHÁCH / NGƯỜI DÙNG (SPA)</text>

  <!-- Lane 2: x=320..660 (w=340) -->
  <rect x="320" y="56" width="340" height="536" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
  <rect x="320" y="56" width="340" height="36" rx="6" fill="#d97706"/>
  <text x="490" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 2: TẦNG ĐIỀU KHIỂN (Auth &amp; TokenService)</text>

  <!-- Lane 3: x=668..960 (w=292) -->
  <rect x="668" y="56" width="292" height="536" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="668" y="56" width="292" height="36" rx="6" fill="#059669"/>
  <text x="814" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 3: TẦNG CSDL (User &amp; SessionDAO)</text>

  
  
    <circle cx="166" cy="112" r="11" fill="#0f172a"/>
    <circle cx="166" cy="568" r="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.8"/>
    <circle cx="166" cy="568" r="6.5" fill="#0f172a"/>
    
  <line x1="166" y1="123" x2="166" y2="146" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arr-navy)"/>

  <!-- Row 1 (y=180) -->
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="148.0" width="264" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="166" y="174" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">1. Gửi Yêu cầu Đăng nhập / Đăng ký</text>
        <text x="166" y="195" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">POST /api/auth/login (email, password)</text>
        
    </g>
    
  <line x1="298" y1="180" x2="340" y2="180" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arr-navy)"/>

  
    <g filter="url(#shadow)">
      <polygon points="490,142 638,180 490,218 342,180" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/>
      
        <text x="490" y="176" text-anchor="middle" fill="#78350f" font-size="13.5" font-weight="700">Chốt 1: Kiểm tra Rate Limit</text>
        <text x="490" y="193" text-anchor="middle" fill="#92400e" font-size="13" font-weight="700">Sai quá 5 lần / 15 phút (IP/Email)?</text>
        
    </g>
    
  <line x1="638" y1="180" x2="678" y2="180" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>

  
    <g filter="url(#shadow)">
      <rect x="681.0" y="148.0" width="266" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="174" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">2. Truy vấn Hồ sơ Người dùng</text>
        <text x="814" y="195" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">SELECT id, password_hash, status</text>
        
    </g>
    

  <!-- Row 2 (y=292) -->
  <line x1="490" y1="218" x2="490" y2="255" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-red)"/>
  
    <rect x="414.6" y="226" width="150.8" height="19" rx="5" fill="#ffffff" fill-opacity="0.96" stroke="#dc2626" stroke-width="1.0"/>
    <text x="490" y="239.5" text-anchor="middle" fill="#dc2626" font-size="12.2" font-weight="700">[Vượt ngưỡng 5 lần]</text>
    
  
    <g filter="url(#shadow)">
      <rect x="342.0" y="259.0" width="296" height="62" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
      
      
        <text x="490" y="284" text-anchor="middle" fill="#991b1b" font-size="14.5" font-weight="700">Từ chối 429 TOO_MANY_REQUESTS</text>
        <text x="490" y="305" text-anchor="middle" fill="#475569" font-size="13.2" font-weight="600">Khóa tạm thời 15 phút chống Brute-force</text>
        
    </g>
    

  <line x1="814" y1="212" x2="814" y2="256" stroke="#be123c" stroke-width="2.5" marker-end="url(#arr-red)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="256.0" width="266" height="68" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.6"/>
      
        <rect x="689.75" y="244.0" width="248.5" height="21" rx="10" fill="#be123c"/>
        <text x="814" y="259.0" text-anchor="middle" fill="#ffffff" font-size="11.8" font-weight="700">[*] TRỌNG TÂM 1: BCRYPT COST=12</text>
        
      
        <text x="814" y="287" text-anchor="middle" fill="#881337" font-size="14.5" font-weight="700">3. Đối chiếu Hash Bcrypt (cost=12)</text>
        <text x="814" y="307" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">password_verify() chống Timing Attack</text>
        
    </g>
    

  <!-- Row 3 (y=404) -->
  <path d="M 814 324 L 814 352 L 490 352 L 490 364" fill="none" stroke="#be123c" stroke-width="2.4" marker-end="url(#arr-red)"/>
  
    <g filter="url(#shadow)">
      <polygon points="490,366 638,404 490,442 342,404" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/>
      
        <text x="490" y="400" text-anchor="middle" fill="#78350f" font-size="13.5" font-weight="700">Chốt 2: Mật khẩu Đúng &amp;</text>
        <text x="490" y="417" text-anchor="middle" fill="#92400e" font-size="13" font-weight="700">Tài khoản đang ACTIVE?</text>
        
    </g>
    

  <line x1="342" y1="404" x2="298" y2="404" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-red)"/>
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="373.0" width="264" height="62" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
      
      
        <text x="166" y="398" text-anchor="middle" fill="#991b1b" font-size="14.5" font-weight="700">Báo lỗi 401 / 403 ACCOUNT_LOCKED</text>
        <text x="166" y="419" text-anchor="middle" fill="#475569" font-size="13.2" font-weight="600">Tăng bộ đếm RateLimiter (+1)</text>
        
    </g>
    

  <!-- Row 4 (y=510) -->
  <line x1="490" y1="442" x2="490" y2="472" stroke="#047857" stroke-width="2.6" marker-end="url(#arr-green)"/>
  
    <rect x="407.4" y="446" width="165.20000000000002" height="19" rx="5" fill="#ffffff" fill-opacity="0.96" stroke="#047857" stroke-width="1.0"/>
    <text x="490" y="459.5" text-anchor="middle" fill="#047857" font-size="12.2" font-weight="700">[Hợp lệ &amp; ACTIVE]</text>
    
  
    <g filter="url(#shadow)">
      <rect x="335.0" y="476.0" width="310" height="68" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.6"/>
      
        <rect x="328.25" y="464.0" width="323.5" height="21" rx="10" fill="#be123c"/>
        <text x="490" y="479.0" text-anchor="middle" fill="#ffffff" font-size="11.8" font-weight="700">[*] TRỌNG TÂM 2: HYBRID JWT &amp; SESSION</text>
        
      
        <text x="490" y="507" text-anchor="middle" fill="#881337" font-size="14.5" font-weight="700">4. Cấp Cặp Token Hybrid JWT</text>
        <text x="490" y="527" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Access (15m JSON) + Refresh (7d Cookie)</text>
        
    </g>
    

  <line x1="645" y1="510" x2="678" y2="510" stroke="#047857" stroke-width="2.6" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="476.0" width="266" height="68" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="504" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">5. Lưu Phiên vào auth_sessions</text>
        <text x="814" y="525" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">INSERT SHA-256(refresh_token)</text>
        
    </g>
    

  <path d="M 814 544 L 814 576 L 302 576 L 302 510 L 298 510" fill="none" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="478.0" width="264" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="166" y="504" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">6. Lưu Access Token &amp; Vào App</text>
        <text x="166" y="525" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Set-Cookie HttpOnly, SameSite=Strict</text>
        
    </g>
    
  <line x1="166" y1="542" x2="166" y2="556" stroke="#0f172a" stroke-width="2.4"/>


  <!-- Bottom Focal Bar -->
  <rect x="20" y="598" width="940" height="34" rx="6" fill="#0f172a"/>
  <text x="36" y="620" fill="#fbbf24" font-size="13.5" font-weight="700">[*] ĐIỂM NHẤN: Chống dò mật khẩu bằng RateLimiter (5 lần/15p) + Bcrypt cost=12; quản lý thu hồi phiên tức thời qua bảng auth_sessions.</text>
</svg>
