<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" width="980" height="650" font-family="Segoe UI, Arial, sans-serif">
  
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e3a8a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#be123c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#047857"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="980" height="650" fill="#ffffff"/>

  <!-- Outer Frame & Title Bar -->
  <rect x="12" y="10" width="956" height="630" rx="8" fill="#fcfdff" stroke="#1e293b" stroke-width="2.4"/>
  <rect x="12" y="10" width="956" height="40" rx="8" fill="#1e293b"/>
  <text x="490" y="36" text-anchor="middle" fill="#ffffff" font-size="16.5" font-weight="700">Sơ đồ Hoạt động Phân làn AD09 — Tổng hợp Tài sản ròng (Net Worth) &amp; Snapshot Nền (UC11)</text>

  <!-- 3 Parallel Vertical Swimlanes (y=56..592) -->
  <!-- Lane 1: x=20..312 (w=292) -->
  <rect x="20" y="56" width="292" height="536" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <rect x="20" y="56" width="292" height="36" rx="6" fill="#0284c7"/>
  <text x="166" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 1: NGƯỜI DÙNG / CRON SYS03</text>

  <!-- Lane 2: x=320..660 (w=340) -->
  <rect x="320" y="56" width="340" height="536" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
  <rect x="320" y="56" width="340" height="36" rx="6" fill="#d97706"/>
  <text x="490" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 2: TẦNG ĐIỀU KHIỂN (NetWorthService)</text>

  <!-- Lane 3: x=668..960 (w=292) -->
  <rect x="668" y="56" width="292" height="536" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="668" y="56" width="292" height="36" rx="6" fill="#059669"/>
  <text x="814" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 3: TẦNG CSDL (SnapshotDAO)</text>

  
  
    <circle cx="166" cy="112" r="11" fill="#0f172a"/>
    <circle cx="166" cy="568" r="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.8"/>
    <circle cx="166" cy="568" r="6.5" fill="#0f172a"/>
    
  <line x1="166" y1="123" x2="166" y2="146" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arr-navy)"/>

  <!-- Row 1 (y=180) -->
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="148.0" width="264" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="166" y="174" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">1. Mở Dashboard / Cron 23:59:59</text>
        <text x="166" y="195" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">GET /api/reports/net-worth (SYS03)</text>
        
    </g>
    
  <line x1="298" y1="180" x2="338" y2="180" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arr-navy)"/>

  
    <g filter="url(#shadow)">
      <rect x="338.0" y="148.0" width="304" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="490" y="174" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">2. Thu thập Các Thành phần Tài sản</text>
        <text x="490" y="195" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">NetWorthService::calculateRealtime()</text>
        
    </g>
    
  <line x1="642" y1="180" x2="678" y2="180" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>

  
    <g filter="url(#shadow)">
      <rect x="681.0" y="148.0" width="266" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="174" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">3. Truy vấn Tổng Ví, Vàng &amp; Vay</text>
        <text x="814" y="195" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Đọc wallets, gold_assets, loans</text>
        
    </g>
    

  <!-- Row 2 (y=295) -->
  <path d="M 814 212 L 814 240 L 490 240 L 490 255" fill="none" stroke="#be123c" stroke-width="2.4" marker-end="url(#arr-red)"/>
  
    <g filter="url(#shadow)">
      <rect x="334.0" y="260.0" width="312" height="70" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.6"/>
      
        <rect x="320.75" y="248.0" width="338.5" height="21" rx="10" fill="#be123c"/>
        <text x="490" y="263.0" text-anchor="middle" fill="#ffffff" font-size="11.8" font-weight="700">[*] TRỌNG TÂM 1: ĐỊNH GIÁ ĐA TÀI SẢN (BR16)</text>
        
      
        <text x="490" y="292" text-anchor="middle" fill="#881337" font-size="14.5" font-weight="700">4. Tính Tổng Tài sản (Total Assets)</text>
        <text x="490" y="312" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Ví Tài sản (VND + USD*FX) + Vàng + Cho vay</text>
        
    </g>
    

  <line x1="646" y1="295" x2="678" y2="295" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="261.0" width="266" height="68" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="289" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">5. Truy vấn Tổng Nợ Phải Trả</text>
        <text x="814" y="310" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Dư nợ Thẻ tín dụng + Dư gốc Đi vay</text>
        
    </g>
    

  <!-- Row 3 (y=410) -->
  <path d="M 814 329 L 814 356 L 490 356 L 490 370" fill="none" stroke="#be123c" stroke-width="2.4" marker-end="url(#arr-red)"/>
  
    <g filter="url(#shadow)">
      <rect x="334.0" y="377.0" width="312" height="70" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.6"/>
      
        <rect x="317.0" y="365.0" width="346.0" height="21" rx="10" fill="#be123c"/>
        <text x="490" y="380.0" text-anchor="middle" fill="#ffffff" font-size="11.8" font-weight="700">[*] TRỌNG TÂM 2: NET WORTH &amp; SAVING RATE</text>
        
      
        <text x="490" y="409" text-anchor="middle" fill="#881337" font-size="14.5" font-weight="700">6. Tổng hợp Net Worth &amp; Cash Flow</text>
        <text x="490" y="429" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Net Worth = Assets - Liabilities (BCMath)</text>
        
    </g>
    

  <line x1="646" y1="412" x2="678" y2="412" stroke="#047857" stroke-width="2.5" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="378.0" width="266" height="68" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="406" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">7. Ghi Ảnh chụp net_worth_snapshots</text>
        <text x="814" y="427" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">UPSERT snapshot theo ngày (23:59)</text>
        
    </g>
    

  <!-- Row 4 (y=512) -->
  <line x1="814" y1="446" x2="814" y2="478" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="480.0" width="266" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="506" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">8. Truy vấn Chuỗi Lịch sử 6 Tháng</text>
        <text x="814" y="527" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">SELECT snapshots ORDER BY date ASC</text>
        
    </g>
    

  <line x1="681" y1="512" x2="642" y2="512" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="338.0" y="480.0" width="304" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="490" y="506" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">9. Tính Tỷ lệ Tiết kiệm (BR18)</text>
        <text x="490" y="527" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">SavingRate = (Income - Expense) / Income</text>
        
    </g>
    

  <line x1="338" y1="512" x2="298" y2="512" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="480.0" width="264" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="166" y="506" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">10. Kết xuất Biểu đồ Xu hướng SPA</text>
        <text x="166" y="527" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Hiển thị Cơ cấu Tài sản &amp; Dòng tiền</text>
        
    </g>
    
  <line x1="166" y1="544" x2="166" y2="556" stroke="#0f172a" stroke-width="2.4"/>


  <!-- Bottom Focal Bar -->
  <rect x="20" y="598" width="940" height="34" rx="6" fill="#0f172a"/>
  <text x="36" y="620" fill="#fbbf24" font-size="13.5" font-weight="700">[*] TRỌNG TÂM: Net Worth = (Tổng Ví Tài sản + Giá trị Vàng thị trường + Dư gốc Cho vay) - (Dư nợ Ví Tín dụng + Dư gốc Đi vay).</text>
</svg>
