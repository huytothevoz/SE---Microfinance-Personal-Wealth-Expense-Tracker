<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" width="980" height="650" font-family="Segoe UI, Arial, sans-serif">
  
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e3a8a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#be123c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#047857"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="980" height="650" fill="#ffffff"/>

  <!-- Outer Frame & Title Bar -->
  <rect x="12" y="10" width="956" height="630" rx="8" fill="#fcfdff" stroke="#1e293b" stroke-width="2.4"/>
  <rect x="12" y="10" width="956" height="40" rx="8" fill="#1e293b"/>
  <text x="490" y="36" text-anchor="middle" fill="#ffffff" font-size="16.5" font-weight="700">Sơ đồ Hoạt động Phân làn AD11 — Quản trị Hệ thống, Thu hồi Phiên &amp; Quyền riêng tư (UC13)</text>

  <!-- 3 Parallel Vertical Swimlanes (y=56..592) -->
  <!-- Lane 1: x=20..312 (w=292) -->
  <rect x="20" y="56" width="292" height="536" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <rect x="20" y="56" width="292" height="36" rx="6" fill="#0284c7"/>
  <text x="166" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 1: ADMIN / NGƯỜI DÙNG (SPA)</text>

  <!-- Lane 2: x=320..660 (w=340) -->
  <rect x="320" y="56" width="340" height="536" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
  <rect x="320" y="56" width="340" height="36" rx="6" fill="#d97706"/>
  <text x="490" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 2: ĐIỀU KHIỂN (Admin &amp; Privacy)</text>

  <!-- Lane 3: x=668..960 (w=292) -->
  <rect x="668" y="56" width="292" height="536" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="668" y="56" width="292" height="36" rx="6" fill="#059669"/>
  <text x="814" y="79" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">LÀN 3: TẦNG CSDL (Session &amp; AuditDAO)</text>

  
  
    <circle cx="166" cy="112" r="11" fill="#0f172a"/>
    <circle cx="166" cy="568" r="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.8"/>
    <circle cx="166" cy="568" r="6.5" fill="#0f172a"/>
    
  <line x1="166" y1="123" x2="166" y2="146" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arr-navy)"/>

  <!-- Row 1 (y=180) -->
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="148.0" width="264" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="166" y="174" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">1. Yêu cầu Khóa User / Đóng TK</text>
        <text x="166" y="195" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">Admin chọn Khóa hoặc User tự Đóng TK</text>
        
    </g>
    
  <line x1="298" y1="180" x2="342" y2="180" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#arr-navy)"/>

  
    <g filter="url(#shadow)">
      <polygon points="490,142 636,180 490,218 344,180" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/>
      
        <text x="490" y="176" text-anchor="middle" fill="#78350f" font-size="13.5" font-weight="700">Chốt 1: Kiểm tra Phân quyền</text>
        <text x="490" y="193" text-anchor="middle" fill="#92400e" font-size="13" font-weight="700">Hành động của ADMIN hay USER?</text>
        
    </g>
    
  <line x1="636" y1="180" x2="678" y2="180" stroke="#be123c" stroke-width="2.5" marker-end="url(#arr-red)"/>

  
    <g filter="url(#shadow)">
      <rect x="681.0" y="146.0" width="266" height="68" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.6"/>
      
        <rect x="678.5" y="134.0" width="271.0" height="21" rx="10" fill="#be123c"/>
        <text x="814" y="149.0" text-anchor="middle" fill="#ffffff" font-size="11.8" font-weight="700">[*] TRỌNG TÂM 1: PRIVACY-BY-DESIGN</text>
        
      
        <text x="814" y="177" text-anchor="middle" fill="#881337" font-size="14.5" font-weight="700">2A. Cấm Admin Xem Ví/Sổ Cá nhân</text>
        <text x="814" y="197" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Privacy-by-Design Isolation (BR11)</text>
        
    </g>
    

  <!-- Row 2 (y=295) -->
  <path d="M 814 214 L 814 240 L 490 240 L 490 255" fill="none" stroke="#be123c" stroke-width="2.4" marker-end="url(#arr-red)"/>
  
    <g filter="url(#shadow)">
      <rect x="337.0" y="262.0" width="306" height="66" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="490" y="289" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">3A. Admin Khóa/Mở Khóa Tài khoản</text>
        <text x="490" y="310" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">Kiểm tra không tự khóa chính mình</text>
        
    </g>
    

  <line x1="643" y1="295" x2="678" y2="295" stroke="#be123c" stroke-width="2.5" marker-end="url(#arr-red)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="262.0" width="266" height="66" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="289" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">4A. Cập nhật status = 'LOCKED'</text>
        <text x="814" y="310" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">UPDATE users SET status='LOCKED'</text>
        
    </g>
    

  <!-- Row 3 (y=410) -->
  <path d="M 490 218 L 490 234 L 166 234 L 166 258" fill="none" stroke="#b45309" stroke-width="2.3" marker-end="url(#arr-amber)"/>
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="262.0" width="264" height="66" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="166" y="289" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">3B. User Xuất JSON &amp; Tự Đóng TK</text>
        <text x="166" y="310" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">Xác nhận mật khẩu + 'DONG TAI KHOAN'</text>
        
    </g>
    
  <path d="M 166 328 L 166 412 L 330 412" fill="none" stroke="#b45309" stroke-width="2.3" marker-end="url(#arr-amber)"/>

  <path d="M 814 328 L 814 355 L 490 355 L 490 370" fill="none" stroke="#be123c" stroke-width="2.4" marker-end="url(#arr-red)"/>
  
    <g filter="url(#shadow)">
      <rect x="334.0" y="377.0" width="312" height="70" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2.6"/>
      
        <rect x="335.75" y="365.0" width="308.5" height="21" rx="10" fill="#be123c"/>
        <text x="490" y="380.0" text-anchor="middle" fill="#ffffff" font-size="11.8" font-weight="700">[*] TRỌNG TÂM 2: THU HỒI PHIÊN TỨC THỜI</text>
        
      
        <text x="490" y="409" text-anchor="middle" fill="#881337" font-size="14.5" font-weight="700">5. Thu hồi Toàn bộ Phiên Đăng nhập</text>
        <text x="490" y="429" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Vô hiệu hóa ngay lập tức mọi JWT/Refresh</text>
        
    </g>
    

  <line x1="646" y1="412" x2="678" y2="412" stroke="#047857" stroke-width="2.5" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="378.0" width="266" height="68" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="406" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">6. Xóa Bảng auth_sessions của User</text>
        <text x="814" y="427" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">DELETE FROM auth_sessions WHERE uid=?</text>
        
    </g>
    

  <!-- Row 4 (y=512) -->
  <line x1="814" y1="446" x2="814" y2="478" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="681.0" y="480.0" width="266" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="814" y="506" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">7. Ghi Nhật ký Kiểm toán Bất biến</text>
        <text x="814" y="527" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">INSERT audit_logs (actor, action, ip)</text>
        
    </g>
    

  <line x1="681" y1="512" x2="642" y2="512" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="338.0" y="480.0" width="304" height="64" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      
      
        <text x="490" y="506" text-anchor="middle" fill="#1e3a8a" font-size="14.5" font-weight="700">8. Phát Thông báo / Đóng Kết nối</text>
        <text x="490" y="527" text-anchor="middle" fill="#334155" font-size="13.2" font-weight="600">Commit ACID Transaction hoàn tất</text>
        
    </g>
    

  <line x1="338" y1="512" x2="298" y2="512" stroke="#047857" stroke-width="2.4" marker-end="url(#arr-green)"/>
  
    <g filter="url(#shadow)">
      <rect x="34.0" y="480.0" width="264" height="64" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2.4"/>
      
      
        <text x="166" y="506" text-anchor="middle" fill="#065f46" font-size="14.5" font-weight="700">9. Chặn Truy cập &amp; Đăng xuất</text>
        <text x="166" y="527" text-anchor="middle" fill="#1e293b" font-size="13.2" font-weight="600">Chuyển hướng về Màn hình Đăng nhập</text>
        
    </g>
    
  <line x1="166" y1="544" x2="166" y2="556" stroke="#0f172a" stroke-width="2.4"/>


  <!-- Bottom Focal Bar -->
  <rect x="20" y="598" width="940" height="34" rx="6" fill="#0f172a"/>
  <text x="36" y="620" fill="#fbbf24" font-size="13.5" font-weight="700">[*] TRỌNG TÂM: Cưỡng chế Privacy-by-Design (Admin cấm xem ví User); thu hồi tức thời toàn bộ phiên trong auth_sessions khi khóa/đóng TK.</text>
</svg>
