<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:2182px;height:1112px;background:#FFFFFF;" width="2182px" height="1112px" viewBox="0 0 2182 1112" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="710.933" y="32.995" fill="#000" font-size="14" textLength="758.14" font-weight="700" font-family="'Segoe UI', Arial, sans-serif">Bản đồ Hoạt động: Quản trị Người dùng, Khóa Tài khoản &amp; Phát Thông báo (AD11 - UC12, UC13)</text></g><rect x="20" y="53.863" width="2135.006" height="15.133" fill="none" style="stroke:none;"/><rect x="20" y="53.863" width="734.76" height="1037.633" fill="#FEF9C3" style="stroke:#FEF9C3;stroke-width:1;"/><ellipse cx="494.125" cy="83.996" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="292.259" y="113.996" width="403.73" height="47.938" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="302.259" y="135.134" fill="#0F172A" font-size="12" textLength="383.73" font-family="'Segoe UI', Arial, sans-serif">1. Đăng nhập quyền Admin &amp; Truy cập "Danh sách người dùng"</text><text x="302.259" y="149.103" fill="#0F172A" font-size="12" textLength="298.049" font-family="'Segoe UI', Arial, sans-serif">(Dashboard vĩ mô cách ly dữ liệu cá nhân - BR11)</text><rect x="237.489" y="181.933" width="513.271" height="33.969" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="247.489" y="203.072" fill="#0F172A" font-size="12" textLength="493.271" font-family="'Segoe UI', Arial, sans-serif">2. Chọn User vi phạm, bấm "Khóa tài khoản" &amp; Nhập lý do (bắt buộc >= 10 ký tự)</text><rect x="380.879" y="235.902" width="226.49" height="33.969" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="390.879" y="257.041" fill="#0F172A" font-size="12" textLength="206.49" font-family="'Segoe UI', Arial, sans-serif">3. Bấm "Xác nhận khóa tài khoản"</text><rect x="109.093" y="333.871" width="326.527" height="33.969" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="119.093" y="355.009" fill="#0F172A" font-size="12" textLength="306.527" font-family="'Segoe UI', Arial, sans-serif">4. Hiển thị thông báo từ chối (400 / 403 Forbidden)</text><ellipse cx="272.357" cy="398.839" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="272.357" cy="398.839" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><ellipse cx="494.125" cy="591.746" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="242.499" y="621.746" width="503.252" height="33.969" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="252.499" y="642.884" fill="#0F172A" font-size="12" textLength="483.252" font-family="'Segoe UI', Arial, sans-serif">9. Truy cập "Cấu hình &amp; Thông báo" &amp; Chọn "Tạo thông báo mới" (UC13, SYS01)</text><rect x="296.715" y="675.714" width="394.818" height="33.969" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="306.715" y="696.853" fill="#0F172A" font-size="12" textLength="374.818" font-family="'Segoe UI', Arial, sans-serif">10. Soạn Tiêu đề, Nội dung thông báo và Chọn mức độ ưu tiên</text><rect x="332.487" y="729.683" width="323.275" height="33.969" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="342.487" y="750.822" fill="#0F172A" font-size="12" textLength="303.275" font-family="'Segoe UI', Arial, sans-serif">11. Bấm "Phát thông báo cho toàn bộ người dùng"</text><rect x="26" y="827.652" width="466.215" height="33.969" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="36" y="848.791" fill="#0F172A" font-size="12" textLength="446.215" font-family="'Segoe UI', Arial, sans-serif">12. Báo lỗi (400 Bad Request): "Nội dung thông báo không được để trống"</text><ellipse cx="259.107" cy="892.621" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="259.107" cy="892.621" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="53.863" x2="20" y2="1091.496" style="stroke:#334155;stroke-width:1.5;"/><rect x="754.76" y="53.863" width="887.266" height="1037.633" fill="#F1F5F9" style="stroke:#F1F5F9;stroke-width:1;"/><polygon points="1015.313,289.871,1296.662,289.871,1308.662,301.871,1296.662,313.871,1015.313,313.871,1003.313,301.871,1015.313,289.871" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1015.313" y="306.025" fill="#0F172A" font-size="12" textLength="281.35" font-family="'Segoe UI', Arial, sans-serif">Kiểm tra lý do khóa &amp; vai trò (BR18, FR14.05)?</text><text x="759.76" y="299.276" fill="#334155" font-size="11" textLength="243.552" font-family="'Segoe UI', Arial, sans-serif">Lý do &lt; 10 ký tự hoặc Khóa Admin duy nhất</text><text x="1308.662" y="299.276" fill="#334155" font-size="11" textLength="105.886" font-family="'Segoe UI', Arial, sans-serif">Hợp lệ >= 10 ký tự</text><rect x="1216.589" y="333.871" width="322.332" height="33.969" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="1226.589" y="355.009" fill="#0F172A" font-size="12" textLength="302.332" font-family="'Segoe UI', Arial, sans-serif">5. Cập nhật trạng thái User = Suspended / Locked</text><rect x="1117.483" y="387.839" width="520.543" height="33.969" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="1127.483" y="408.978" fill="#0F172A" font-size="12" textLength="500.543" font-family="'Segoe UI', Arial, sans-serif">6. Thu hồi toàn bộ Refresh Token &amp; Hủy hiệu lực Access Token ngay lập tức (BR18)</text><rect x="1215.405" y="441.808" width="324.699" height="33.969" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="1225.405" y="462.947" fill="#0F172A" font-size="12" textLength="304.699" font-family="'Segoe UI', Arial, sans-serif">7. Ghi nhật ký kiểm toán Admin Audit Log bất biến</text><polygon points="1066.676,783.652,1245.299,783.652,1257.299,795.652,1245.299,807.652,1066.676,807.652,1054.676,795.652,1066.676,783.652" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1066.676" y="799.806" fill="#0F172A" font-size="12" textLength="178.623" font-family="'Segoe UI', Arial, sans-serif">Kiểm tra nội dung thông báo?</text><text x="902.309" y="793.058" fill="#334155" font-size="11" textLength="152.367" font-family="'Segoe UI', Arial, sans-serif">Tiêu đề hoặc Nội dung rỗng</text><text x="1257.299" y="793.058" fill="#334155" font-size="11" textLength="86.92" font-family="'Segoe UI', Arial, sans-serif">Nội dung hợp lệ</text><rect x="1215.246" y="827.652" width="351.518" height="33.969" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="1225.246" y="848.791" fill="#0F172A" font-size="12" textLength="331.518" font-family="'Segoe UI', Arial, sans-serif">13. Tạo bản ghi SystemAnnouncement mới trong CSDL</text><rect x="1205.188" y="881.621" width="371.633" height="33.969" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="1215.188" y="902.759" fill="#0F172A" font-size="12" textLength="351.633" font-family="'Segoe UI', Arial, sans-serif">14. Đẩy thông báo vào hàng đợi Broadcast Queue (SYS01)</text><rect x="1174.078" y="935.589" width="433.854" height="33.969" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="1184.078" y="956.728" fill="#0F172A" font-size="12" textLength="413.854" font-family="'Segoe UI', Arial, sans-serif">15. Ghi nhật ký kiểm toán Admin Audit Log xác nhận phát thông báo</text><line x1="754.76" y1="53.863" x2="754.76" y2="1091.496" style="stroke:#334155;stroke-width:1.5;"/><rect x="1642.026" y="53.863" width="511.717" height="1037.633" fill="#F8FAFC" style="stroke:#F8FAFC;stroke-width:1;"/><rect x="1648.026" y="495.777" width="501.717" height="33.969" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="1658.026" y="516.916" fill="#0F172A" font-size="12" textLength="481.717" font-family="'Segoe UI', Arial, sans-serif">8. Bị đăng xuất ngay lập tức; khi gửi request tiếp theo bị chặn lỗi 403 Forbidden</text><ellipse cx="1898.885" cy="560.746" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1898.885" cy="560.746" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="1706.891" y="989.558" width="410.486" height="47.938" fill="#FFF" style="stroke:#0F172A;stroke-width:0.5;" rx="4" ry="4"/><text x="1716.891" y="1010.697" fill="#0F172A" font-size="12" textLength="390.486" font-family="'Segoe UI', Arial, sans-serif">16. Biểu tượng chuông thông báo (Notification Center) sáng đèn;</text><text x="1716.891" y="1024.666" fill="#0F172A" font-size="12" textLength="278.127" font-family="'Segoe UI', Arial, sans-serif">Người dùng xem toàn văn thông báo hệ thống</text><ellipse cx="1912.134" cy="1068.496" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1912.134" cy="1068.496" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="1642.026" y1="53.863" x2="1642.026" y2="1091.496" style="stroke:#334155;stroke-width:1.5;"/><line x1="2153.743" y1="53.863" x2="2153.743" y2="1091.496" style="stroke:#334155;stroke-width:1.5;"/><line x1="494.125" y1="93.996" x2="494.125" y2="113.996" style="stroke:#0F172A;stroke-width:1;"/><polygon points="490.125,103.996,498.125,103.996,494.125,113.996" fill="#0F172A" style="stroke:#0F172A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="494.125" y1="161.933" x2="494.125" y2="181.933" style="stroke:#0F172A;stroke-width:1;"/><polygon points="490.125,171.933,498.125,171.933,494.125,181.933" fill="#0F172A" style="stroke:#0F172A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/>